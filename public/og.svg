<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121624"/>
      <stop offset="50%" stop-color="#181d2e"/>
      <stop offset="100%" stop-color="#1e1830"/>
    </linearGradient>
    <linearGradient id="blueViolet" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f8cff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glowTopRight" cx="85%" cy="15%" r="60%">
      <stop offset="0%" stop-color="rgba(168, 85, 247, 0.25)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <radialGradient id="glowBottomLeft" cx="15%" cy="85%" r="60%">
      <stop offset="0%" stop-color="rgba(79, 140, 255, 0.2)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#glowTopRight)"/>
  <rect width="1200" height="630" fill="url(#glowBottomLeft)"/>

  <!-- Grid Pattern -->
  <g stroke="rgba(255, 255, 255, 0.04)" stroke-width="1">
    <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200M0 420H1200M0 490H1200M0 560H1200"/>
    <path d="M100 0V630M200 0V630M300 0V630M400 0V630M500 0V630M600 0V630M700 0V630M800 0V630M900 0V630M1000 0V630M1100 0V630"/>
  </g>

  <!-- Outer Card Frame -->
  <rect x="50" y="50" width="1100" height="530" rx="20" fill="rgba(26, 32, 50, 0.6)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Header / Brand -->
  <g transform="translate(100, 100)">
    <!-- Logo Mark -->
    <rect x="0" y="0" width="56" height="56" rx="14" fill="rgba(79, 140, 255, 0.15)" stroke="#4f8cff" stroke-width="2"/>
    <path d="M16 38V18l12 14 12-14v20" fill="none" stroke="#4f8cff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Brand text -->
    <text x="74" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="3" fill="#f8fafc">OKCODE</text>
    
    <!-- Status badge -->
    <rect x="780" y="8" width="170" height="38" rx="19" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.4)" stroke-width="1"/>
    <circle cx="802" cy="27" r="5" fill="#06b6d4"/>
    <text x="818" y="32" font-family="Consolas, Monaco, monospace" font-size="14" font-weight="600" fill="#22d3ee" letter-spacing="1">STUDIO · SPAIN</text>
  </g>

  <!-- Hero Content -->
  <g transform="translate(100, 220)">
    <text x="0" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">Desarrollo Web, Apps Móviles</text>
    <text x="0" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">y Software a Medida</text>
    
    <text x="0" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" fill="#94a3b8" font-weight="400">
      Creamos soluciones digitales de alto rendimiento para empresas y startups.
    </text>
  </g>

  <!-- Tags / Pillars Bar -->
  <g transform="translate(100, 460)">
    <!-- Tag 1 -->
    <rect x="0" y="0" width="200" height="46" rx="8" fill="rgba(79, 140, 255, 0.12)" stroke="rgba(79, 140, 255, 0.35)" stroke-width="1"/>
    <text x="100" y="28" font-family="Consolas, Monaco, monospace" font-size="15" font-weight="600" fill="#93c5fd" text-anchor="middle">WEB &amp; NEXT.JS</text>

    <!-- Tag 2 -->
    <rect x="220" y="0" width="220" height="46" rx="8" fill="rgba(168, 85, 247, 0.12)" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1"/>
    <text x="330" y="28" font-family="Consolas, Monaco, monospace" font-size="15" font-weight="600" fill="#d8b4fe" text-anchor="middle">APPS IOS · ANDROID</text>

    <!-- Tag 3 -->
    <rect x="460" y="0" width="220" height="46" rx="8" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.35)" stroke-width="1"/>
    <text x="570" y="28" font-family="Consolas, Monaco, monospace" font-size="15" font-weight="600" fill="#67e8f9" text-anchor="middle">TIENDAS ONLINE</text>

    <!-- Tag 4 -->
    <rect x="700" y="0" width="250" height="46" rx="8" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1"/>
    <text x="825" y="28" font-family="Consolas, Monaco, monospace" font-size="15" font-weight="600" fill="#cbd5e1" text-anchor="middle">ES · EN · 中文 (3 IDIOMAS)</text>
  </g>
</svg>
